<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Tasnimul Hasan</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../nav/nav.css" />
    <link rel="stylesheet" href="contact.css" />
</head>

<body>
    <div id="cursor"></div>

    <div id="main">
        <div class="main_nav">
            <div class="nav-content">
                <div class="nav-logo">
                    <img src="../../images/logo_2.svg" alt="Logo">
                    <p class="logo-title">Tasnimul Hasan</p>
                </div>

                <nav class="nav-items">
                    <a href="../../index.html" class="text-sm/6 font-semibold text-black">Home <span
                            class="underline"></span></a>
                    <a href="../about/about.html" class="text-sm/6 font-semibold text-black">About <span
                            class="underline"></span></a>
                    <a href="../skill/skill.html" class="text-sm/6 font-semibold text-black">Skills <span
                            class="underline"></span></a>
                    <a href="../portfolio/portfolio.html" class="text-sm/6 font-semibold text-black">Portfolio </a>
                    <a href="contact.html" class="text-sm/6 font-semibold text-black active">Contact </a>
                </nav>

                <div class="hello-me">
                    <a href="mailto:mdtasnimulh@gmail.com">hello@Tasnimul</a>
                </div>
            </div>
        </div>

        <!-- Headline -->
        <section class="contact_hero">
            <h1 class="contact_title" id="contactTitle">
                Let us collaborate on your
                <span class="title_pill" aria-hidden="true"><i class="fa-solid fa-mobile-screen-button"></i></span>
                <span class="title_muted">projects</span>
            </h1>
            <svg class="sparkle" viewBox="0 0 40 40" aria-hidden="true">
                <path d="M20 0 C21.5 13 27 18.5 40 20 C27 21.5 21.5 27 20 40 C18.5 27 13 21.5 0 20 C13 18.5 18.5 13 20 0Z" />
            </svg>
        </section>

        <!-- Form -->
        <section class="contact_form_section">
            <form class="contact_form" id="contactForm" novalidate>
                <div class="form_grid">
                    <div class="field reveal">
                        <label for="fullName">Full name*</label>
                        <input type="text" id="fullName" name="name" placeholder="Enter your name" autocomplete="name"
                            required>
                        <span class="error" data-for="fullName"></span>
                    </div>

                    <div class="field reveal">
                        <label for="email">Email address*</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email address"
                            autocomplete="email" required>
                        <span class="error" data-for="email"></span>
                    </div>

                    <div class="field reveal">
                        <span class="label">Services</span>
                        <div class="chips" id="serviceChips" role="group" aria-label="Services">
                            <button type="button" class="chip active" aria-pressed="true">Android app</button>
                            <button type="button" class="chip" aria-pressed="false">Jetpack Compose UI</button>
                            <button type="button" class="chip" aria-pressed="false">Kotlin Multiplatform</button>
                            <button type="button" class="chip" aria-pressed="false">Flutter app</button>
                            <button type="button" class="chip" aria-pressed="false">SDK / Integration</button>
                        </div>
                    </div>

                    <div class="field reveal">
                        <label for="budget">Budget</label>
                        <div class="select_wrap">
                            <select id="budget" name="budget">
                                <option>Under $500</option>
                                <option selected>$500 - $2,500</option>
                                <option>$2,500 - $5,000</option>
                                <option>$5,000+</option>
                                <option>Not sure yet</option>
                            </select>
                            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                        </div>
                    </div>

                    <div class="field field_full reveal">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="1" placeholder="Write your message here..."></textarea>
                    </div>
                </div>

                <div class="form_actions reveal">
                    <button type="submit" class="send_btn">Send Message</button>
                    <button type="submit" class="send_arrow" aria-label="Send message"><i
                            class="fa-solid fa-arrow-up-right-from-square"></i></button>
                    <p class="form_status" id="formStatus" role="status" aria-live="polite"></p>
                </div>
            </form>
        </section>

        <!-- Contact details + map -->
        <section class="contact_info_section">
            <h2 class="section_title reveal">Prefer to reach out directly?</h2>

            <div class="info_grid">
                <div class="info_cards">
                    <a class="info_card reveal" href="mailto:mdtasnimulh@gmail.com">
                        <span class="icon"><i class="fa-solid fa-envelope"></i></span>
                        <span class="text">
                            <span class="k">Email</span>
                            <span class="v">mdtasnimulh@gmail.com</span>
                        </span>
                    </a>

                    <div class="info_card reveal">
                        <span class="icon"><i class="fa-solid fa-phone"></i></span>
                        <span class="text">
                            <span class="k">Mobile</span>
                            <a class="v" href="tel:+8801833072034">+880-1833072034</a>
                            <a class="v" href="tel:+8801568910140">+880-1568910140</a>
                        </span>
                    </div>

                    <div class="info_card reveal">
                        <span class="icon"><i class="fa-solid fa-location-dot"></i></span>
                        <span class="text">
                            <span class="k">Location</span>
                            <span class="v">Dhaka, Bangladesh</span>
                        </span>
                    </div>
                </div>

                <div class="map_card reveal">
                    <iframe title="Map of Dhaka, Bangladesh" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                        src="https://www.google.com/maps?q=Dhaka,+Bangladesh&amp;z=12&amp;output=embed"
                        allowfullscreen></iframe>
                </div>
            </div>
        </section>

        <footer class="contact_footer">
            <p>&copy; <span id="year"></span> Tasnimul Hasan. Let's build something great.</p>
        </footer>
    </div>

    <script src="https://unpkg.com/lenis@1.3.11/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"
        integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"
        integrity="sha512-wOeEC+9qERAzhliwBFPDb6t8TiFFxdxG8vhK/Ygs7TuC44bpg8pg/X2/U/u+0X4fK05wb9id1EIipnF02+CFQw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"
        integrity="sha512-P2IDYZfqSwjcSjX0BKeNhwRUH8zRPGlgcWl5n6gBLzdi4Y5/0O4zaXrtO4K9TZK6Hn1BenYpKowuCavNandERg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="../nav/nav.js"></script>
    <script src="contact.js"></script>
</body>

</html>
